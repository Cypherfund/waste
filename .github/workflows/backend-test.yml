name: Backend Tests

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: waste_user
          POSTGRES_PASSWORD: waste_dev_pass
          POSTGRES_DB: waste_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci --legacy-peer-deps

      - name: Create test environment file
        working-directory: ./backend
        run: |
          cat > .env.test << EOF
          DATABASE_HOST=localhost
          DATABASE_PORT=5432
          DATABASE_USERNAME=waste_user
          DATABASE_PASSWORD=waste_dev_pass
          DATABASE_NAME=waste_management_test
          REDIS_HOST=localhost
          REDIS_PORT=6379
          REDIS_PASSWORD=
          JWT_SECRET=test_secret_key_for_testing
          JWT_REFRESH_SECRET=test_refresh_secret_for_testing_only
          JWT_ACCESS_EXPIRATION=3600
          JWT_REFRESH_EXPIRATION=604800
          JWT_EXPIRATION=1d
          PORT=3001
          API_PREFIX=api/v1
          NODE_ENV=test
          CORS_ORIGINS=http://localhost:5173,http://localhost:3000
          THROTTLE_TTL=60000
          THROTTLE_LIMIT=100
          IMGBB_API_KEY=test-api-key
          EOF

      - name: Run database migrations
        working-directory: ./backend
        run: |
          npm run build
          npx ts-node -r tsconfig-paths/register ./node_modules/typeorm/cli.js migration:run -d src/database/data-source.ts
        env:
          DOTENV_CONFIG_PATH: ./.env.test

      - name: Run unit tests
        working-directory: ./backend
        run: npm test
        env:
          DOTENV_CONFIG_PATH: ./.env.test

      - name: Run integration tests
        if: github.ref == 'refs/heads/main'
        working-directory: ./backend
        run: npm run test:integration
        env:
          DOTENV_CONFIG_PATH: ./.env.test

      - name: Run E2E tests
        if: github.ref == 'refs/heads/main'
        working-directory: ./backend
        run: npm run test:e2e
        env:
          DOTENV_CONFIG_PATH: ./.env.test

      - name: Run lint
        working-directory: ./backend
        run: npm run lint

      - name: Build
        working-directory: ./backend
        run: npm run build
