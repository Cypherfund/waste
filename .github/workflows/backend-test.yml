name: Backend Tests

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: waste_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci --legacy-peer-deps

      - name: Create test environment file
        working-directory: ./backend
        run: |
          cat > .env.test << EOF
          DB_HOST=localhost
          DB_PORT=5432
          DB_USERNAME=test
          DB_PASSWORD=test
          DB_DATABASE=waste_management_test
          JWT_SECRET=test_secret_key_for_testing
          JWT_EXPIRATION=1d
          PORT=3001
          NODE_ENV=test
          EOF

      - name: Run database migrations
        working-directory: ./backend
        run: |
          npm run build
          npx ts-node -r tsconfig-paths/register ./node_modules/typeorm/cli.js migration:run -d src/database/data-source.ts
        env:
          DOTENV_CONFIG_PATH: ./.env.test

      - name: Run unit tests
        working-directory: ./backend
        run: npm test
        env:
          DOTENV_CONFIG_PATH: ./.env.test

      - name: Run lint
        working-directory: ./backend
        run: npm run lint

      - name: Build
        working-directory: ./backend
        run: npm run build
