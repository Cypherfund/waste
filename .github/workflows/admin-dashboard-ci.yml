name: Admin Dashboard CI

on:
  push:
    branches:
      - main
    paths:
      - 'admin-dashboard/**'
  pull_request:
    branches:
      - main
    paths:
      - 'admin-dashboard/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: ./admin-dashboard
        run: npm ci

      - name: Build
        working-directory: ./admin-dashboard
        run: npm run build

      - name: Run tests
        working-directory: ./admin-dashboard
        run: npm test -- --run
